# 依存ライブラリの更新を、週1回 PR で提案する。
# 公開から14日未満のバージョンは対象にしない。PR は自動ではマージしない。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    # 公開から14日未満のバージョンは提案しない(供給網攻撃への備え)
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    # 公開から14日未満のバージョンは提案しない(供給網攻撃への備え)
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
